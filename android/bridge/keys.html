<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'" />
    <title>Exchange API keys</title>
    <!-- The bridge, shared with the terminal window (window.ocDesktop.keys). -->
    <script src="./bridge.js"></script>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #0a0a0a; color: #e6e8ec; }
      nav { display: flex; gap: 6px; overflow-x: auto; padding: 12px 14px; border-bottom: 1px solid #23272f; background: #111318; scrollbar-width: none; }
      nav::-webkit-scrollbar { display: none; }
      nav button { flex-shrink: 0; display: flex; gap: 6px; align-items: center; height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #2a2f3a; background: none; color: #a3a8b3; font: inherit; font-size: 14px; }
      nav button.active { background: #14b8a6; border-color: #14b8a6; color: #04130f; font-weight: 600; }
      nav .dot { width: 8px; height: 8px; border-radius: 50%; background: #3a404c; }
      nav .dot.on { background: #34d399; }
      nav button.active .dot.on { background: #04130f; }
      main { padding: 16px 16px 40px; }
      h1 { font-size: 18px; margin: 0 0 6px; }
      p { margin: 0 0 10px; color: #a3a8b3; }
      ol { margin: 0 0 14px; padding-left: 20px; color: #a3a8b3; }
      li { margin-bottom: 4px; }
      a { color: #2dd4bf; }
      .warn { background: #2a1f0d; border: 1px solid #5c4313; color: #f5c46b; padding: 10px 12px; border-radius: 10px; margin-bottom: 14px; font-size: 14px; }
      label { display: block; margin: 14px 0 6px; font-weight: 600; font-size: 14px; }
      label.inline { font-weight: 400; display: flex; gap: 10px; align-items: center; margin-top: 16px; }
      label.inline input { width: 20px; height: 20px; }
      input[type="password"], input[type="text"], textarea { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #2a2f3a; background: #111318; color: inherit; font-family: ui-monospace, Consolas, monospace; font-size: 16px; }
      input:focus, textarea:focus { outline: none; border-color: #14b8a6; }
      textarea { height: 130px; resize: vertical; -webkit-text-security: disc; font-size: 13px; }
      .actions { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
      button.btn { height: 48px; border-radius: 12px; border: 1px solid #2a2f3a; background: #1b1f27; color: inherit; font: inherit; font-weight: 600; }
      button.primary { background: #14b8a6; border-color: #14b8a6; color: #04130f; }
      button:disabled { opacity: 0.5; }
      #status { min-height: 22px; margin-top: 14px; white-space: pre-wrap; }
      .ok { color: #34d399; } .err { color: #f87171; }
      .hidden { display: none !important; }
    </style>
  </head>
  <body>
    <nav id="tabs"></nav>
    <main>
      <h1 id="title"></h1>
      <p id="intro"></p>
      <ol id="steps"></ol>
      <div class="warn"><span id="perm"></span> Never enable withdrawals. Keys are checked with the exchange, then stored encrypted on this phone (Android Keystore) and never shown again.</div>
      <div id="form">
        <label for="apiKey" id="apiKeyLabel">API key</label>
        <input id="apiKey" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" />
        <label for="secret" id="secretLabel">API secret</label>
        <input id="secret" type="password" autocomplete="off" spellcheck="false" />
        <textarea id="secretArea" class="hidden" spellcheck="false" autocapitalize="off" autocorrect="off" placeholder="-----BEGIN EC PRIVATE KEY-----"></textarea>
        <div id="passRow">
          <label for="passphrase">Passphrase</label>
          <input id="passphrase" type="password" autocomplete="off" spellcheck="false" />
        </div>
        <label class="inline" id="testRow"><input id="testnet" type="checkbox" /> <span id="testLabel">Test network key</span></label>
        <div class="actions">
          <button id="save" class="btn primary">Check and save</button>
          <button id="remove" class="btn">Remove key</button>
        </div>
      </div>
      <div id="oandaForm" class="hidden">
        <div class="actions">
          <button id="openOanda" class="btn primary">Open the OANDA token page</button>
        </div>
      </div>
      <div id="status"></div>
    </main>
    <script>
      const $ = (id) => document.getElementById(id);
      const api = window.ocDesktop.keys;
      const VENUES = {
        binance: {
          label: "Binance", url: "https://www.binance.com/en/my/settings/api-management",
          steps: ["Open API Management in your Binance account.", "Create an API key (system generated, HMAC).", "Edit restrictions: tick Enable Reading and Enable Spot & Margin Trading."],
          test: "Spot test network key (testnet.binance.vision)",
        },
        okx: {
          label: "OKX", url: "https://www.okx.com/account/my-api", pass: true,
          steps: ["Open API in your OKX account.", "Create a V5 API key with Read and Trade permissions and set a passphrase.", "Paste the key, secret and passphrase."],
          test: "Demo trading key",
        },
        bybit: {
          label: "Bybit", url: "https://www.bybit.com/app/user/api-management",
          steps: ["Open API Management in your Bybit account.", "Create a system-generated key with Read-Write, and tick Unified Trading › Spot.", "Paste the key and secret."],
          test: "Testnet key (api-testnet.bybit.com)",
        },
        kucoin: {
          label: "KuCoin", url: "https://www.kucoin.com/account/api", pass: true,
          steps: ["Open API Management in your KuCoin account.", "Create an API key with General and Spot Trading permissions and set a passphrase.", "Paste the key, secret and passphrase."],
        },
        coinbase: {
          label: "Coinbase", url: "https://portal.cdp.coinbase.com/projects/api-keys", pem: true,
          steps: ["Open the Coinbase Developer Platform › API keys.", "Create a Secret API key with View and Trade permissions (ECDSA or Ed25519).", "Paste the key name (organizations/…/apiKeys/…) and the private key."],
        },
        mexc: {
          label: "MEXC", url: "https://www.mexc.com/user/openapi",
          steps: ["Open API Management in your MEXC account.", "Create a key with Spot › View Account Details and Trade.", "Paste the access key and secret key."],
        },
        htx: {
          label: "HTX (Huobi)", url: "https://www.htx.com/", portfolio: true,
          steps: ["Open API Management in your HTX account.", "Create an API key with the Read permission (add Trade to cancel orders from the portfolio).", "Paste the access key and secret key."],
        },
        whitebit: {
          label: "WhiteBIT", url: "https://whitebit.com/", portfolio: true,
          steps: ["Open Account › API in your WhiteBIT account.", "Create a key for Trade API (v4) and activate it; allow all endpoints, or at least the trading balance and order endpoints.", "Paste the public key and secret key."],
        },
        gate: {
          label: "Gate.io", url: "https://www.gate.com/", portfolio: true,
          steps: ["Open API Management in your Gate account.", "Create an APIv4 key for the classic account with Spot trade set to Read Only (Read and Write to cancel orders from the portfolio).", "Paste the key and secret."],
        },
        hitbtc: {
          label: "HitBTC", url: "https://hitbtc.com/", portfolio: true,
          steps: ["Open Settings › API keys in your HitBTC account.", "Create a key and tick Orderbook, History, Trading balance (add Place/cancel orders to cancel from the portfolio).", "Paste the API key and secret key."],
        },
        poloniex: {
          label: "Poloniex", url: "https://www.poloniex.com/", portfolio: true,
          steps: ["Open API Keys in your Poloniex account settings.", "Create a key with Read permission (add Trade to cancel orders from the portfolio).", "Paste the API key and secret."],
        },
        oanda: {
          label: "OANDA", url: "https://www.oanda.com/", oanda: true,
          steps: ["Forex and metals (XAUUSD, EURUSD …) trade on OANDA.", "OANDA uses one API token instead of a key and secret.", "The token page checks it with OANDA and stores it encrypted."],
        },
      };
      let current = new URLSearchParams(location.search).get("venue") || "binance";
      if (!VENUES[current]) current = "binance";
      let configured = {};
      const status = (text, cls) => { $("status").textContent = text; $("status").className = cls || ""; };

      function renderTabs() {
        $("tabs").innerHTML = "";
        for (const [id, v] of Object.entries(VENUES)) {
          const b = document.createElement("button");
          b.className = id === current ? "active" : "";
          b.dataset.venue = id;
          b.innerHTML = `<span>${v.label}</span><span class="dot${configured[id] ? " on" : ""}"></span>`;
          b.onclick = () => { current = id; render(); };
          $("tabs").appendChild(b);
        }
        $("tabs").querySelector(".active")?.scrollIntoView({ inline: "center", block: "nearest" });
      }

      function render() {
        const v = VENUES[current];
        renderTabs();
        $("title").textContent = `${v.label} API ${v.oanda ? "token" : "key"}`;
        const link = `<a href="${v.url}" target="_blank">${new URL(v.url).hostname}</a>`;
        $("intro").innerHTML = v.portfolio
          ? `Shows your ${v.label} balances and open orders in the portfolio (no charts or order ticket for ${v.label}). Create the key at ${link}.`
          : `Orders on ${v.label} pairs go to your ${v.label} account once this is set. Create it at ${link}.`;
        $("perm").innerHTML = v.portfolio ? "Turn on <b>read</b> only (trade only to cancel orders here)." : "Turn on <b>read</b> and <b>spot trading</b> only.";
        $("steps").innerHTML = v.steps.map((s) => `<li>${s}</li>`).join("");
        $("form").classList.toggle("hidden", Boolean(v.oanda));
        $("oandaForm").classList.toggle("hidden", !v.oanda);
        $("passRow").classList.toggle("hidden", !v.pass);
        $("testRow").classList.toggle("hidden", !v.test);
        $("testLabel").textContent = v.test || "";
        $("secret").classList.toggle("hidden", Boolean(v.pem));
        $("secretArea").classList.toggle("hidden", !v.pem);
        $("apiKeyLabel").textContent = v.pem ? "API key name" : "API key";
        $("secretLabel").textContent = v.pem ? "Private key" : "API secret";
        for (const id of ["apiKey", "secret", "secretArea", "passphrase"]) $(id).value = "";
        $("testnet").checked = false;
        status(configured[current] ? `A ${v.label} ${v.oanda ? "token" : "key"} is saved. Enter a new one to replace it.` : "");
      }

      async function refresh() {
        configured = await api.status();
        render();
      }

      $("save").onclick = async () => {
        const v = VENUES[current];
        $("save").disabled = true;
        status(`Checking with ${v.label}…`);
        const r = await api.save(current, {
          apiKey: $("apiKey").value,
          secret: v.pem ? $("secretArea").value : $("secret").value,
          passphrase: $("passphrase").value,
          testnet: $("testnet").checked,
        });
        $("save").disabled = false;
        if (r.ok) {
          configured[current] = true;
          renderTabs();
          for (const id of ["apiKey", "secret", "secretArea", "passphrase"]) $(id).value = "";
          const net = r.switched ? ` This is a ${r.testnet ? "test network" : "live"} key, so it was saved as one.` : "";
          const use = v.portfolio ? "Its balances and open orders now show in the portfolio." : `Orders on ${v.label} pairs now go to this account.`;
          status(`Saved. ${v.label} answered with ${r.assets} asset${r.assets === 1 ? "" : "s"} on the account.${net} ${use}`, "ok");
        } else {
          status(r.error, "err");
        }
      };
      $("remove").onclick = async () => {
        await api.clear(current);
        configured[current] = false;
        renderTabs();
        status("Key removed. Orders on these pairs go to the paper account again.");
      };
      $("openOanda").onclick = () => api.openOanda();
      refresh();
    </script>
  </body>
</html>
